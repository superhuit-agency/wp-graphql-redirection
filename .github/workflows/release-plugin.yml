---
name: 'Release WP-GraphQL-Redirection plugin'

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      # PHP Composer dependencies
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ github.token }}
      - id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
      - shell: bash
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - shell: bash
        run: |
            rsync -r \
            --exclude .git \
            --exclude .github \
            --exclude .gitignore \
            --exclude .editorconfig \
            --exclude .vscode \
            --exclude .wp-env.json \
            --exclude composer.json \
            --exclude composer.lock \
            --exclude wp-graphql-redirection.pot \
            . ./wp-graphql-redirection

      - name: Set up git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Generate project changelog for package
        shell: bash
        run: |
          git-cliff --config cliff.toml --strip all --output wp-graphql-redirection/CHANGELOG.md

      - name: Generate release notes
        shell: bash
        run: |
          git-cliff --config cliff.toml --current --strip all --output release-notes.md
          
      - name: Archive release
        shell: bash
        run: zip -qq -r wp-graphql-redirection.zip wp-graphql-redirection

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: wp-graphql-redirection-zip
          path: wp-graphql-redirection.zip
          if-no-files-found: error

      - name: Publish GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=''
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            PRERELEASE_FLAG='--prerelease'
          fi

          gh release create "${GITHUB_REF_NAME}" \
            wp-graphql-redirection.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --latest=false \
            ${PRERELEASE_FLAG}

  publish-release-belt:
    name: Publish ZIP to Release Belt
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release ZIP artifact
        uses: actions/download-artifact@v8
        with:
          name: wp-graphql-redirection-zip
          path: .

      - name: Upload ZIP to Release Belt (optional)
        uses: ./.github/actions/publish-release-belt
        with:
          release_tag: ${{ github.ref_name }}
          zip_file: wp-graphql-redirection.zip
          package_slug: wp-graphql-redirection
          package_vendor: superhuit
          package_type: wordpress-plugin
          user: ${{ secrets.RELEASE_BELT_USER }}
          host: ${{ secrets.RELEASE_BELT_HOST }}
          port: ${{ secrets.RELEASE_BELT_PORT }}
          ssh_key: ${{ secrets.RELEASE_BELT_PUBLISH_PRIVATE_KEY }}
          root_path: ${{ secrets.RELEASE_BELT_PATH }}
